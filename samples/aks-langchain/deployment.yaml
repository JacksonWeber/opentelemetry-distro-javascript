apiVersion: v1
kind: Namespace
metadata:
  name: langchain-aks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-aks-sample
  namespace: langchain-aks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langchain-aks-sample
  template:
    metadata:
      labels:
        app: langchain-aks-sample
    spec:
      containers:
        - name: app
          image: YOUR_ACR_NAME.azurecr.io/langchain-aks-sample:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --import ./telemetry.mjs
            - name: OTEL_SERVICE_NAME
              value: langchain-aks-sample
            - name: PORT
              value: "3000"
            - name: ENABLE_SENSITIVE_DATA
              value: "false"
            - name: AZURE_OPENAI_API_VERSION
              value: "2024-06-01"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: langchain-aks-secrets
                  key: applicationinsights-connection-string
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langchain-aks-secrets
                  key: azure-openai-api-key
            - name: AZURE_OPENAI_INSTANCE_NAME
              valueFrom:
                secretKeyRef:
                  name: langchain-aks-secrets
                  key: azure-openai-instance-name
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              valueFrom:
                secretKeyRef:
                  name: langchain-aks-secrets
                  key: azure-openai-deployment-name
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langchain-aks-sample
  namespace: langchain-aks
spec:
  selector:
    app: langchain-aks-sample
  ports:
    - name: http
      port: 80
      targetPort: http
